name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
      - staging
      - develop

jobs:
  # 1. Select Environment Job
  select-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      gitops_file: ${{ steps.set-env.outputs.gitops_file }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "staging" || "${{ github.ref_name }}" == "develop" ]]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "gitops_file=apps/workloads/app-staging.yaml" >> $GITHUB_OUTPUT
          else
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "gitops_file=apps/workloads/app-production.yaml" >> $GITHUB_OUTPUT
          fi

  # 2. Build and Push Job
  build-and-push:
    needs: select-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.select-environment.outputs.env_name }}
    outputs:
      image_tag: ${{ needs.select-environment.outputs.env_name }}-${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Unit Tests
        run: |
          npm install
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/devops-app:${{ needs.select-environment.outputs.env_name }}-${{ github.sha }}
            ${{ secrets.REGISTRY_USERNAME }}/devops-app:${{ needs.select-environment.outputs.env_name }}-latest

  # 3. Update GitOps Job (Shows as 3rd node in the Actions graph)
  update-gitops:
    needs: [select-environment, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.select-environment.outputs.env_name }}
    steps:
      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          GITHUB_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TARGET_FILE: ${{ needs.select-environment.outputs.gitops_file }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://${GITHUB_USER}:${GITOPS_PAT}@github.com/${GITHUB_USER}/gitops.git gitops-repo
          cd gitops-repo
          sed -i -E "s|(tag: ).*|\1\"${IMAGE_TAG}\"|" ${TARGET_FILE}
          git add ${TARGET_FILE}
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(gitops): update ${TARGET_FILE} image tag to ${IMAGE_TAG} [skip ci]" && git push origin main)
